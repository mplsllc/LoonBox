name: Loon CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Flutter Analysis & Tests ─────────────────────────────────────
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ─── Rust Tests ────────────────────────────────────────────────────
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  # ─── Build Desktop (Windows) ───────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    needs: [flutter, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter build windows --release

  # ─── Build Desktop (macOS) ─────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    needs: [flutter, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter build macos --release

  # ─── Build Desktop (Linux) ─────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    needs: [flutter, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev
      - run: flutter pub get
      - run: flutter build linux --release
