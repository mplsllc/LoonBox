[package]
name = "loonbox_audio"
version = "0.1.0"
edition = "2021"
description = "LoonBox audio engine — decode, DSP, and output"

[dependencies]
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "wav", "aac", "pcm", "isomp4"] }
cpal = "0.15"
rubato = "0.15"
dasp = "0.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
realfft = "3.4"
log = "0.4"
thiserror = "1.0"

[dev-dependencies]
env_logger = "0.11"
