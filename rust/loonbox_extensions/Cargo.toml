[package]
name = "loonbox_extensions"
version = "0.1.0"
edition = "2021"
description = "LoonBox extension runtime — Lua and WASM plugin hosting"

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
# wasmtime for WASM extensions (v2)
# wasmtime = "25"
log = "0.4"
thiserror = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
