[package]
name = "loonbox_bridge"
version = "0.1.0"
edition = "2021"
description = "LoonBox FFI bridge — flutter_rust_bridge API surface"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(frb_expand)'] }

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
loonbox_audio = { path = "../loonbox_audio" }
loonbox_metadata = { path = "../loonbox_metadata" }
loonbox_extensions = { path = "../loonbox_extensions" }
loonbox_browser = { path = "../loonbox_browser" }
flutter_rust_bridge = "=2.11.1"
once_cell = "1.20"
parking_lot = "0.12"
anyhow = "1.0"
log = "0.4"
thiserror = "1.0"
serde_json = "1"
